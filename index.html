<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style/style.css">
</head>

<body>
    <h2>Calculate the price of your ticket</h2>
    <form id="ticket-form">
        <label for="full-name-input">
            name and surname: <input id="full-name-input" type="text" />
        </label>
        <label for="age-input">
            age: <input id="age-input" type="number" min="0" max="123" />
        </label>
        <label for="kilometers-input">
            kilometers: <input id="kilometers-input" type="number" min="0" max="1400" />
        </label>
        <input type="submit" value="Calculate" />
    </form>

    <h2>Your Ticket</h2>

    <table id="tickets-review">
        <thead>
            <tr>
                <th>Passenger Name</th>
                <th>Discount</th>
                <th>Wagon</th>
                <th>Code</th>
                <th>Cost</th>
            </tr>
        </thead>
        <tbody id="table-body"></tbody>
    </table>


    <script src="js/script.js"></script>
</body>

</html>
